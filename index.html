    <!-- PATCH VIDEO LOGO / LOADER DAKA — vidéo responsive, muted, sans texte loader -->
    <script>
    (function() {
      var VIDEO_URL = 'https://etjwmqnbfsevlwaeixwb.supabase.co/storage/v1/object/public/Transform_this_static_logo_int-online-video-cutter.com.mp4/Transform_this_static_logo_int%20(online-video-cutter.com).mp4';

      function createMutedVideo(className) {
        var video = document.createElement('video');
        video.src = VIDEO_URL;
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.defaultMuted = true;
        video.playsInline = true;
        video.preload = 'auto';
        video.className = className || '';
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('aria-hidden', 'true');
        return video;
      }

      function injectLoaderCss() {
        if (document.getElementById('daka-video-loader-css')) return;

        var style = document.createElement('style');
        style.id = 'daka-video-loader-css';
        style.textContent = `
          .brand-loader-orb {
            width: clamp(118px, 34vw, 190px) !important;
            height: clamp(118px, 34vw, 190px) !important;
            max-width: 72vh !important;
            max-height: 72vh !important;
            border-radius: 32px !important;
            background: transparent !important;
            border: 0 !important;
            box-shadow: none !important;
            overflow: hidden !important;
            position: relative !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin-inline: auto !important;
          }

          .brand-loader-orb::before,
          .brand-loader-orb::after,
          .brand-loader-orb span,
          .brand-loader-orb .loader-text,
          .brand-loader-orb .brand-loader-text {
            display: none !important;
            content: none !important;
          }

          .daka-loader-video {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
            object-fit: contain !important;
            border-radius: inherit !important;
            background: transparent !important;
          }

          .loading-overlay,
          .loader-overlay,
          .brand-loader,
          .loading-screen,
          [class*="loading"],
          [class*="loader"] {
            text-align: center;
          }

          @media (max-width: 480px) {
            .brand-loader-orb {
              width: min(68vw, 150px) !important;
              height: min(68vw, 150px) !important;
              border-radius: 26px !important;
            }
          }
        `;
        document.head.appendChild(style);
      }

      function patchLogo() {
        injectLoaderCss();

        // 1. Logo header : garde la vidéo en petit format propre.
        var logoMark = document.querySelector('.logo .logo-mark');
        if (logoMark && !logoMark.querySelector('video')) {
          var headerVideo = createMutedVideo('daka-header-logo-video');
          headerVideo.style.cssText = 'width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 0 20px rgba(139,92,246,0.55);display:block;';
          logoMark.style.cssText = 'display:flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;';
          logoMark.innerHTML = '';
          logoMark.appendChild(headerVideo);
          headerVideo.play().catch(function(){});
        }

        // 2. Loader : remplace boule + texte par vidéo seule, centrée et responsive.
        document.querySelectorAll('.brand-loader-orb').forEach(function(orb) {
          var existingVideo = orb.querySelector('video.daka-loader-video');
          if (!existingVideo) {
            var loaderVideo = createMutedVideo('daka-loader-video');
            orb.innerHTML = '';
            orb.appendChild(loaderVideo);
            loaderVideo.play().catch(function(){});
          } else {
            Array.prototype.slice.call(orb.children).forEach(function(child) {
              if (child !== existingVideo) child.remove();
            });
            existingVideo.muted = true;
            existingVideo.play().catch(function(){});
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', patchLogo);
      } else {
        patchLogo();
      }

      document.addEventListener('DOMContentLoaded', function() {
        var mo = new MutationObserver(function(){ patchLogo(); });
        mo.observe(document.body, { childList: true, subtree: true });
      });
    })();
    </script>
