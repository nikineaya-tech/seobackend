    <!-- PATCH VIDEO LOGO DAKA — remplace la sphère statique par la vidéo Supabase -->
    <script>
    (function() {
      var VIDEO_URL = 'https://etjwmqnbfsevlwaeixwb.supabase.co/storage/v1/object/public/Transform_this_static_logo_int-online-video-cutter.com.mp4/Transform_this_static_logo_int%20(online-video-cutter.com).mp4';
      function patchLogo() {
        // --- 1. Logo header ---
        var logoMark = document.querySelector('.logo .logo-mark');
        if (logoMark && !logoMark.querySelector('video')) {
          var v = document.createElement('video');
          v.src = VIDEO_URL; v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
          v.setAttribute('playsinline','');
          v.style.cssText = 'width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 0 20px rgba(139,92,246,0.55);display:block;';
          logoMark.style.cssText = 'display:flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;';
          logoMark.innerHTML = '';
          logoMark.appendChild(v);
          v.play().catch(function(){});
        }
        // --- 2. Tous les brand-loader-orb (loading screens) ---
        document.querySelectorAll('.brand-loader-orb').forEach(function(orb) {
          if (orb.querySelector('video')) return;
          var span = orb.querySelector('span');
          var txt = span ? span.textContent : 'DAKA';
          var vid = document.createElement('video');
          vid.src = VIDEO_URL; vid.autoplay = true; vid.loop = true; vid.muted = true; vid.playsInline = true;
          vid.setAttribute('playsinline','');
          vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;';
          var newSpan = document.createElement('span');
          newSpan.textContent = txt;
          newSpan.style.cssText = 'position:relative;z-index:2;text-shadow:0 2px 8px rgba(0,0,0,0.85);';
          orb.style.position = 'relative';
          orb.style.overflow = 'hidden';
          orb.innerHTML = '';
          orb.appendChild(vid);
          orb.appendChild(newSpan);
          vid.play().catch(function(){});
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', patchLogo);
      } else { patchLogo(); }
      // Observer pour MutationObserver (loading states dynamiques)
      document.addEventListener('DOMContentLoaded', function() {
        var mo = new MutationObserver(function(){ patchLogo(); });
        mo.observe(document.body, { childList: true, subtree: true });
      });
    })();
    </script>
