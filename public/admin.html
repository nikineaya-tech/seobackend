<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daka Admin - Leads & Activity</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#020617;color:#e5f3ff}.wrap{width:min(1180px,calc(100% - 28px));margin:28px auto}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:18px;border:1px solid rgba(148,163,184,.16);border-radius:24px;background:linear-gradient(145deg,#071120,#020617)}h1{margin:0;font-size:clamp(1.6rem,4vw,3rem)}p{color:#94a3b8}.login,.card{margin-top:18px;padding:18px;border:1px solid rgba(148,163,184,.16);border-radius:22px;background:#08111f}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{padding:16px;border-radius:18px;background:#020817;border:1px solid rgba(34,211,238,.14)}.metric strong{display:block;font-size:1.8rem}.metric span{color:#8aa0ba;font-size:.78rem;font-weight:800;text-transform:uppercase}input,button{min-height:44px;border-radius:12px;border:1px solid rgba(148,163,184,.22);background:#020817;color:#e5f3ff;padding:10px 12px}button{cursor:pointer;background:linear-gradient(135deg,#22c55e,#22d3ee);color:#02111d;font-weight:900;border:0}.events{display:grid;gap:8px}.event{display:grid;grid-template-columns:120px 1fr 160px;gap:12px;padding:12px;border:1px solid rgba(148,163,184,.12);border-radius:14px;background:#030b18}.pill{display:inline-flex;border-radius:999px;padding:5px 9px;background:rgba(34,211,238,.12);color:#67e8f9;font-size:.72rem;font-weight:900}.muted{color:#8aa0ba}.danger{color:#fca5a5}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.event{grid-template-columns:1fr}.top{display:grid}}</style>
</head>
<body>
  <main class="wrap">
    <div class="top"><div><h1>Daka Activity Room</h1><p>Supervision first-party: logins, leads, clics, pages vues et sorties.</p></div><button onclick="loadActivity()">Rafraichir</button></div>
    <section class="login"><label>Admin token <input id="token" type="password" placeholder="X-Admin-Token"></label> <button onclick="saveToken()">Connecter</button><p class="muted">Utilise ADMIN_TOKEN cote Render. Aucune donnee technique publique.</p></section>
    <section class="card"><div id="metrics" class="grid"></div></section>
    <section class="card"><h2>Derniers evenements</h2><div id="events" class="events"></div></section>
  </main>
<script>
const $=id=>document.getElementById(id);$('token').value=localStorage.getItem('dakaAdminToken')||'';function saveToken(){localStorage.setItem('dakaAdminToken',$('token').value.trim());loadActivity()}function metric(k,v){return '<div class="metric"><strong>'+v+'</strong><span>'+k+'</span></div>'}function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}async function loadActivity(){const token=$('token').value.trim()||localStorage.getItem('dakaAdminToken')||'';const r=await fetch('/api/admin/activity',{headers:{'x-admin-token':token}});if(!r.ok){$('events').innerHTML='<p class="danger">Acces refuse ou ADMIN_TOKEN manquant.</p>';return}const d=await r.json();$('metrics').innerHTML=metric('Events',d.summary.totalEvents)+metric('Vues',d.summary.pageViews)+metric('Clics',d.summary.clicks)+metric('Sorties',d.summary.exits);$('events').innerHTML=(d.events||[]).map(e=>'<div class="event"><span class="pill">'+esc(e.type)+'</span><div><b>'+esc(e.path||'/')+'</b><br><span class="muted">'+esc(e.label||e.title||'')+'</span></div><span class="muted">'+new Date(e.ts||Date.now()).toLocaleString()+'</span></div>').join('')||'<p class="muted">Aucun event.</p>'}loadActivity().catch(()=>{});
</script>
</body>
</html>
