<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Daka - Nouvelle adresse</title>
  <style>
    :root{color-scheme:dark;--bg:#020617;--cyan:#22d3ee;--green:#22c55e;--violet:#8b5cf6;--text:#e5f3ff;--muted:#93a8c3}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 18% 12%,rgba(34,211,238,.2),transparent 30%),radial-gradient(circle at 82% 20%,rgba(139,92,246,.2),transparent 34%),linear-gradient(135deg,#020617,#07111f);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
    .card{width:min(560px,calc(100% - 32px));padding:30px;border:1px solid rgba(125,211,252,.22);border-radius:26px;background:rgba(8,17,31,.84);box-shadow:0 26px 88px rgba(0,0,0,.42);text-align:center}
    .badge{display:inline-flex;padding:8px 12px;border-radius:999px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#86efac;font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
    h1{margin:18px 0 10px;font-size:clamp(1.45rem,4vw,2.2rem);line-height:1.1}p{margin:0;color:var(--muted);line-height:1.6}.cta{display:inline-flex;justify-content:center;align-items:center;min-height:46px;margin-top:20px;padding:0 18px;border-radius:999px;background:linear-gradient(135deg,var(--green),var(--cyan));color:#02111d;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Daka Market Insight</span>
    <h1>Cette adresse a changé.</h1>
    <p>Nous transférons votre connexion vers la nouvelle plateforme.</p>
    <a class="cta" id="fallback" href="https://marketinsight.mktnstrategix.com/">Ouvrir Market Insight</a>
  </main>
  <script>
    (function(){
      var target = 'https://marketinsight.mktnstrategix.com/';
      var query = window.location.search || '';
      var hash = window.location.hash || '';
      var next = target + query + hash;
      document.getElementById('fallback').href = next;
      window.location.replace(next);
    })();
  </script>
</body>
</html>
