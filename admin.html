<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daka Admin - Activity Room</title>
  <meta name="robots" content="noindex,nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#020617;--panel:#08111f;--panel2:#0b1527;--line:rgba(148,163,184,.18);--text:#e5f3ff;--muted:#8ea4bf;--cyan:#22d3ee;--green:#22c55e;--violet:#8b5cf6;--red:#fb7185}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 15% -5%,rgba(34,211,238,.16),transparent 30%),radial-gradient(circle at 80% 0,rgba(139,92,246,.14),transparent 28%),var(--bg);color:var(--text)}
    .wrap{width:min(1180px,calc(100% - 28px));margin:28px auto 48px}.top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:22px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,rgba(8,17,31,.96),rgba(2,6,23,.88));box-shadow:0 24px 70px rgba(0,0,0,.28)}
    h1{margin:0;font-size:clamp(1.8rem,4vw,3.4rem);letter-spacing:-.04em}.top p,.muted{color:var(--muted)}.top p{margin:8px 0 0;line-height:1.55}.badge{display:inline-flex;align-items:center;gap:8px;width:max-content;margin-bottom:12px;padding:8px 12px;border-radius:999px;background:rgba(34,197,94,.11);color:#86efac;border:1px solid rgba(34,197,94,.24);font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
    .card{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:22px;background:rgba(8,17,31,.78);box-shadow:0 18px 50px rgba(0,0,0,.18)}.login{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:end}
    label{display:grid;gap:7px;color:#cbd5e1;font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}input,select,button{min-height:44px;border-radius:13px;border:1px solid rgba(148,163,184,.24);background:#020817;color:var(--text);padding:10px 12px;font:inherit}button{cursor:pointer;background:linear-gradient(135deg,var(--green),var(--cyan));color:#02111d;font-weight:900;border:0;box-shadow:0 14px 34px rgba(34,211,238,.18)}button.secondary{background:rgba(139,92,246,.16);color:#ddd6fe;border:1px solid rgba(139,92,246,.32);box-shadow:none}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{padding:17px;border-radius:18px;background:linear-gradient(145deg,#020817,#071225);border:1px solid rgba(34,211,238,.14)}.metric strong{display:block;font-size:2rem;letter-spacing:-.04em}.metric span{display:block;color:var(--muted);font-size:.72rem;font-weight:900;text-transform:uppercase}
    .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar h2{margin:0;font-size:1.05rem}.filters{display:flex;gap:8px;flex-wrap:wrap}.events{display:grid;gap:9px}.event{display:grid;grid-template-columns:130px minmax(0,1fr) 180px;gap:12px;align-items:center;padding:12px;border:1px solid rgba(148,163,184,.12);border-radius:15px;background:#030b18}.pill{display:inline-flex;width:max-content;border-radius:999px;padding:6px 9px;background:rgba(34,211,238,.12);color:#67e8f9;font-size:.72rem;font-weight:900}.event b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.danger{color:#fca5a5}.ok{color:#86efac}.small{font-size:.78rem;line-height:1.45}.empty{padding:24px;text-align:center;border:1px dashed rgba(148,163,184,.22);border-radius:18px;color:var(--muted)}
    @media(max-width:820px){.top,.login,.event{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.top button{width:100%}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{width:min(100% - 18px,1180px);margin-top:14px}.card,.top{border-radius:18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="top">
      <div>
        <span class="badge">Daka Admin Room</span>
        <h1>Leads, logins et activite client.</h1>
        <p>Tableau de supervision first-party pour suivre les vues, clics, sorties et signaux d'engagement sur Daka Market Insight.</p>
      </div>
      <button type="button" onclick="loadActivity()">Rafraichir</button>
    </section>

    <section class="card login">
      <label>Admin token
        <input id="token" type="password" placeholder="ADMIN_TOKEN Render" autocomplete="current-password">
      </label>
      <button type="button" onclick="saveToken()">Connecter</button>
      <button class="secondary" type="button" onclick="clearToken()">Deconnecter</button>
      <p class="muted small" style="grid-column:1/-1;margin:0">Cette page peut etre hebergee sur Deal.ai. Les donnees sont lues via le backend securise Render.</p>
    </section>

    <section class="card">
      <div id="metrics" class="grid"></div>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>Derniers evenements</h2>
        <div class="filters">
          <select id="typeFilter" onchange="renderEvents()">
            <option value="">Tous</option>
            <option value="page_view">Vues</option>
            <option value="click">Clics</option>
            <option value="page_exit">Sorties</option>
          </select>
          <input id="searchFilter" oninput="renderEvents()" placeholder="Filtrer page, label, domaine">
        </div>
      </div>
      <div id="events" class="events"></div>
    </section>
  </main>

<script>
const API_BASE_URL = window.DAKA_API_BASE_URL || (location.hostname.includes('localhost') ? 'http://localhost:10000' : 'https://seobackend-f81n.onrender.com');
const $ = (id) => document.getElementById(id);
let LAST_EVENTS = [];

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (s) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
}

function metric(label, value) {
  return '<div class="metric"><strong>' + esc(value || 0) + '</strong><span>' + esc(label) + '</span></div>';
}

function saveToken() {
  localStorage.setItem('dakaAdminToken', $('token').value.trim());
  loadActivity();
}

function clearToken() {
  localStorage.removeItem('dakaAdminToken');
  $('token').value = '';
  LAST_EVENTS = [];
  $('metrics').innerHTML = '';
  $('events').innerHTML = '<div class="empty">Session admin fermee.</div>';
}

async function loadActivity() {
  const token = $('token').value.trim() || localStorage.getItem('dakaAdminToken') || '';
  $('token').value = token;
  $('events').innerHTML = '<div class="empty">Chargement des signaux...</div>';
  try {
    const response = await fetch(API_BASE_URL + '/api/admin/activity', {
      headers: { 'x-admin-token': token },
      mode: 'cors',
      credentials: 'omit'
    });
    if (!response.ok) throw new Error(response.status === 401 ? 'ADMIN_AUTH_REQUIRED' : 'ADMIN_ACTIVITY_UNAVAILABLE');
    const data = await response.json();
    const summary = data.summary || {};
    LAST_EVENTS = Array.isArray(data.events) ? data.events : [];
    $('metrics').innerHTML =
      metric('Events', summary.totalEvents) +
      metric('Vues', summary.pageViews) +
      metric('Clics', summary.clicks) +
      metric('Sorties', summary.exits);
    renderEvents();
  } catch (error) {
    $('metrics').innerHTML = '';
    $('events').innerHTML = '<p class="danger">Acces refuse, token incorrect ou API admin indisponible.</p><p class="muted small">' + esc(error.message) + '</p>';
  }
}

function renderEvents() {
  const type = $('typeFilter').value;
  const query = $('searchFilter').value.trim().toLowerCase();
  const events = LAST_EVENTS.filter((event) => {
    if (type && event.type !== type) return false;
    if (!query) return true;
    return [event.path, event.domain, event.title, event.label, event.email].some((value) => String(value || '').toLowerCase().includes(query));
  });
  $('events').innerHTML = events.map((event) => {
    const date = new Date(event.ts || Date.now()).toLocaleString();
    const label = event.label || event.title || event.email || '';
    return '<div class="event"><span class="pill">' + esc(event.type) + '</span><div><b>' + esc(event.path || '/') + '</b><br><span class="muted small">' + esc(label) + '</span></div><span class="muted small">' + esc(date) + '</span></div>';
  }).join('') || '<div class="empty">Aucun signal ne correspond au filtre.</div>';
}

$('token').value = localStorage.getItem('dakaAdminToken') || '';
loadActivity();
</script>
</body>
</html>
