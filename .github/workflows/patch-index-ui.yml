name: Patch index UI directly

# Rerun marker: 2026-06-09 direct index patch

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '.github/workflows/patch-index-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch index.html directly
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8-sig')
          video_url = 'https://etjwmqnbfsevlwaeixwb.supabase.co/storage/v1/object/public/Transform_this_static_logo_int-online-video-cutter.com.mp4/Transform_this_static_logo_int%20(online-video-cutter.com).mp4'

          def fix_csp(match):
              prefix, csp, suffix = match.group(1), match.group(2), match.group(3)
              if 'media-src' not in csp:
                  csp += " media-src 'self' https://etjwmqnbfsevlwaeixwb.supabase.co blob: data:;"
              elif 'etjwmqnbfsevlwaeixwb.supabase.co' not in re.search(r'media-src[^;]*;', csp, re.I).group(0):
                  csp = re.sub(r'media-src([^;]*);', r"media-src\1 https://etjwmqnbfsevlwaeixwb.supabase.co blob: data:;", csp, flags=re.I)
              return prefix + csp + suffix

          html = re.sub(
              r'(<meta\s+http-equiv=["\']Content-Security-Policy["\']\s+content=["\'])([^"\']*)(["\']\s*>)',
              fix_csp,
              html,
              count=1,
              flags=re.I
          )

          start = '<!-- DAKA_UI_VIDEO_HOTFIX_START -->'
          end = '<!-- DAKA_UI_VIDEO_HOTFIX_END -->'
          html = re.sub(re.escape(start) + r'[\s\S]*?' + re.escape(end), '', html)

          block = f'''\n{start}
<style id="daka-ui-video-hotfix-css">
.brand-loader-orb,.loader-logo,.loading-logo,.brand-loader .logo-mark,.loading-screen .logo-mark,[data-loader-logo],[data-brand-loader],.daka-video-loader-wrap{{width:clamp(128px,32vw,196px)!important;height:clamp(128px,32vw,196px)!important;max-width:72vh!important;max-height:72vh!important;border-radius:30px!important;background:transparent!important;background-image:none!important;border:0!important;box-shadow:none!important;overflow:hidden!important;position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;margin-inline:auto!important}}
.logo .logo-mark,.logo-mark,[data-logo-mark],.brand-logo,.navbar-logo{{background:transparent!important;background-image:none!important;overflow:hidden!important}}
.brand-loader-orb:before,.brand-loader-orb:after,.loader-logo:before,.loader-logo:after,.loading-logo:before,.loading-logo:after,.logo-mark:before,.logo-mark:after{{display:none!important;content:none!important;background:none!important;background-image:none!important;box-shadow:none!important}}
.brand-loader-orb>*:not(video),.loader-logo>*:not(video),.loading-logo>*:not(video),.brand-loader .logo-mark>*:not(video),.loading-screen .logo-mark>*:not(video){{display:none!important;visibility:hidden!important;opacity:0!important}}
.brand-loader-orb span,.brand-loader-orb img,.brand-loader-orb svg,.brand-loader-orb i,.brand-loader-orb .loader-text,.brand-loader-orb .brand-loader-text,.brand-loader-orb [class*="text"],.brand-loader-orb [class*="label"]{{display:none!important;visibility:hidden!important;opacity:0!important}}
.daka-loader-video,.daka-header-logo-video,video[data-daka-video-logo="true"]{{display:block!important;width:100%!important;height:100%!important;object-fit:contain!important;border-radius:inherit!important;background:transparent!important;visibility:visible!important;opacity:1!important}}
.daka-header-logo-video{{width:52px!important;height:52px!important;border-radius:50%!important;object-fit:cover!important;box-shadow:0 0 20px rgba(139,92,246,.55)!important}}
.competitor-actions,.competitor-card-actions,.action-buttons,.result-actions,[data-competitor-actions="true"]{{display:flex;align-items:center;gap:8px;flex-wrap:wrap}}
button[data-no-collapse="true"],a[data-no-collapse="true"]{{position:relative;z-index:10}}
@media(max-width:480px){{.brand-loader-orb,.loader-logo,.loading-logo,.daka-video-loader-wrap{{width:min(68vw,156px)!important;height:min(68vw,156px)!important;border-radius:26px!important}}.daka-header-logo-video{{width:44px!important;height:44px!important}}}}
</style>
<script id="daka-ui-video-hotfix-js">
(function(){{
'use strict';
var VIDEO_URL={video_url!r};
var VIDEO_ATTR='data-daka-video-logo';
function createVideo(cls){{var v=document.createElement('video');v.src=VIDEO_URL;v.autoplay=true;v.loop=true;v.muted=true;v.defaultMuted=true;v.playsInline=true;v.preload='auto';v.className=cls||'';v.setAttribute('muted','');v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.setAttribute('aria-hidden','true');v.setAttribute(VIDEO_ATTR,'true');return v;}}
function play(v){{if(!v)return;v.muted=true;v.defaultMuted=true;var p=v.play&&v.play();if(p&&p.catch)p.catch(function(){{}});}}
function replaceWithVideo(node,cls){{if(!node)return;var existing=node.querySelector('video['+VIDEO_ATTR+']');if(!existing){{existing=createVideo(cls);node.innerHTML='';node.appendChild(existing);}}else{{Array.prototype.slice.call(node.children).forEach(function(child){{if(child!==existing)child.remove();}});existing.classList.add(cls);}}node.classList.add('daka-video-loader-wrap');node.style.background='transparent';node.style.backgroundImage='none';node.style.boxShadow='none';play(existing);}}
function patchLogoAndLoader(){{var loaders='.brand-loader-orb,.loader-logo,.loading-logo,.brand-loader .logo-mark,.loading-screen .logo-mark,[data-loader-logo],[data-brand-loader]';document.querySelectorAll(loaders).forEach(function(el){{replaceWithVideo(el,'daka-loader-video');}});document.querySelectorAll('.logo .logo-mark,[data-logo-mark],.navbar-logo').forEach(function(el){{replaceWithVideo(el,'daka-header-logo-video');}});}}
function isActionButton(target){{return target&&target.closest&&target.closest('button,a,input,select,textarea,.copy-btn,.copy-button,.btn-copy,.competitor-actions,.competitor-card-actions,.action-buttons,.result-actions,[data-no-collapse],[data-action],[data-copy],[onclick]');}}
function protectButtons(root){{var scope=root&&root.querySelectorAll?root:document;var selector='button,a,[role="button"],.copy-btn,.copy-button,.btn-copy,[data-copy],[data-action],[onclick]';scope.querySelectorAll(selector).forEach(function(el){{if(el.getAttribute('data-daka-no-collapse-bound')==='true')return;var txt=(el.textContent||el.getAttribute('aria-label')||el.getAttribute('title')||'').toLowerCase();var cls=(el.className||'').toString().toLowerCase();var action=(el.getAttribute('data-action')||'').toLowerCase();var signal=txt+' '+cls+' '+action;var isCompetitorAction=/copy|copier|clipboard|funnel|analyse|analysis|audit|seo|rapport|report|export|pdf|utiliser|use|open|ouvrir/.test(signal);var isInside=!!el.closest('.competitor-card,.competitor-item,.competitor-row,.competitor,[data-competitor],.result-card,.report-card,details,.accordion,.accordion-item');if(!isCompetitorAction&&!isInside)return;el.setAttribute('data-daka-no-collapse-bound','true');el.setAttribute('data-no-collapse','true');if(el.tagName==='BUTTON'&&!el.getAttribute('type'))el.setAttribute('type','button');['click','mousedown','mouseup','pointerdown','pointerup','touchstart','touchend'].forEach(function(name){{el.addEventListener(name,function(event){{event.stopPropagation();}},false);}});}});}}
function protectScroll(){{if(window.__dakaNoScrollJumpPatch)return;window.__dakaNoScrollJumpPatch=true;document.addEventListener('click',function(event){{if(isActionButton(event.target))return;var toggle=event.target&&event.target.closest&&event.target.closest('summary,.accordion-header,.accordion-toggle,.collapse-header,.section-header,[data-accordion-toggle],[data-collapse-toggle]');if(!toggle)return;var x=window.scrollX;var y=window.scrollY;requestAnimationFrame(function(){{setTimeout(function(){{if(Math.abs(window.scrollY-y)>120)window.scrollTo(x,y);}},80);}});}},true);}}
function run(){{patchLogoAndLoader();protectButtons(document);protectScroll();}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();document.addEventListener('DOMContentLoaded',function(){{var mo=new MutationObserver(function(){{run();}});if(document.body)mo.observe(document.body,{{childList:true,subtree:true}});}});
}})();
</script>
{end}\n'''

          if '</head>' not in html.lower():
              raise SystemExit('index.html has no closing head tag')
          html = re.sub(r'</head>', block + '</head>', html, count=1, flags=re.I)

          p.write_text(html, encoding='utf-8')
          PY

      - name: Verify hotfix markers
        run: |
          grep -q "DAKA_UI_VIDEO_HOTFIX_START" index.html
          grep -q "media-src 'self' https://etjwmqnbfsevlwaeixwb.supabase.co" index.html
          grep -q "daka-ui-video-hotfix-js" index.html
          grep -q "daka-loader-video" index.html

      - name: Commit patched index.html
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: patch index html video loader directly"
          git push
